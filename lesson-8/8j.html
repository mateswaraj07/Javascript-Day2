<!DOCTYPE html>
<html>
  <head>
    <title>8j - Rock Paper Scissors</title>
  </head>

  <body>

    <button onclick="
      playGame('rock');
    ">
      Rock
    </button>

    <button onclick="
      playGame('paper');
    ">
      Paper
    </button>

    <button onclick="
      playGame('scissors');
    ">
      Scissors
    </button>

    <script>
      const score = {
        wins: 0,
        losses: 0,
        ties: 0
      };

      function playGame(guess) {
        const randomNumber = Math.random();

        let computerMove;

        if (randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        let result;

        if (guess === computerMove) {
          result = 'Tie';
          score.ties++;
        } else if (
          (guess === 'rock' && computerMove === 'scissors') ||
          (guess === 'paper' && computerMove === 'rock') ||
          (guess === 'scissors' && computerMove === 'paper')
        ) {
          result = 'You win';
          score.wins++;
        } else {
          result = 'You lose';
          score.losses++;
        }

        console.log(result);
        console.log(score);
      }
    </script>

  </body>
</html>
