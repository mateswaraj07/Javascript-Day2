<!DOCTYPE html>
<html>
  <head>
    <title>9j - Calculator</title>
  </head>

  <body>

    <p class="calculation"></p>

    <button onclick="
      updateCalculation('1');
    ">1</button>

    <button onclick="
      updateCalculation('2');
    ">2</button>

    <button onclick="
      updateCalculation('3');
    ">3</button>

    <button onclick="
      updateCalculation(' + ');
    ">+</button>

    <br><br>

    <button onclick="
      updateCalculation('4');
    ">4</button>

    <button onclick="
      updateCalculation('5');
    ">5</button>

    <button onclick="
      updateCalculation('6');
    ">6</button>

    <button onclick="
      updateCalculation(' - ');
    ">-</button>

    <br><br>

    <button onclick="
      updateCalculation('7');
    ">7</button>

    <button onclick="
      updateCalculation('8');
    ">8</button>

    <button onclick="
      updateCalculation('9');
    ">9</button>

    <button onclick="
      updateCalculation(' * ');
    ">*</button>

    <br><br>

    <button onclick="
      updateCalculation('0');
    ">0</button>

    <button onclick="
      updateCalculation(' / ');
    ">/</button>

    <button onclick="
      calculation = eval(calculation);
      saveCalculation();
      displayCalculation();
    ">=</button>

    <button onclick="
      calculation = '';
      saveCalculation();
      displayCalculation();
    ">Clear</button>

    <script>
      let calculation = localStorage.getItem('calculation') || '';

      function updateCalculation(value) {
        calculation += value;

        saveCalculation();
        displayCalculation();
      }

      function saveCalculation() {
        localStorage.setItem('calculation', calculation);
      }

      function displayCalculation() {
        document.querySelector('.calculation').innerHTML =
          calculation;
      }

      displayCalculation();
    </script>

  </body>
</html>
