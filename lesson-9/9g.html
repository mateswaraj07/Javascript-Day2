<!DOCTYPE html>
<html>
  <head>
    <title>9g - Shipping Calculator</title>
  </head>

  <body>
    <input class="cost-input" placeholder="Cost of order">

    <button onclick="
      calculateTotal();
    ">
      Calculate
    </button>

    <p class="total"></p>

    <script>
      function calculateTotal() {
        const input = document.querySelector('.cost-input');

        let cost = Number(input.value);

        if (cost < 40) {
          cost += 10;
        }

        document.querySelector('.total').innerHTML =
          `$${cost.toFixed(2)}`;
      }
    </script>
  </body>
</html>
